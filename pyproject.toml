[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shapeguard-frac"
version = "0.1.0"
description = "Reproducible, annotation-aware X-ray fracture segmentation research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.5,<3",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.2,<3",
  "Pillow>=10.4,<13",
  "opencv-python-headless>=4.10,<5",
  "matplotlib>=3.9,<4",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
sam = ["segment-anything==1.0", "torchvision>=0.20,<1"]
report = ["reportlab>=4.2,<5", "python-pptx>=1.0,<2"]

[project.scripts]
shapeguard = "shapeguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shapeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
